apiVersion: 1
datasources:
  - name: EnergyDB
    uid: energy-db
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: energy
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      timeInterval: 10s
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
