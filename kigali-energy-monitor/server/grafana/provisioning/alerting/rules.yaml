# Generated by scripts/build_dashboard.py. Add a contact point (email, Telegram, SMS) in Grafana.
apiVersion: 1
groups:
- orgId: 1
  name: building-energy
  folder: Energy
  interval: 1m
  rules:
  - uid: meter-offline
    title: Shop meter offline
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      team: building
    annotations:
      summary: A shop meter has sent nothing for over 5 minutes while the building has power.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: energy-db
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: energy-db
        editorMode: code
        format: table
        rawQuery: true
        rawSql: 'SELECT d.name AS shop, coalesce(extract(epoch FROM now() - max(r.ts)) / 60, 1440) AS minutes_silent

          FROM devices d LEFT JOIN readings r ON r.device_id = d.device_id AND r.ts > now() - interval ''1 day''

          WHERE d.role = ''shop'' AND d.active AND (SELECT data->>''new'' FROM events WHERE type = ''source_change'' ORDER BY ts DESC LIMIT 1) <> ''NONE'' GROUP BY d.name'
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
  - uid: shop-overload
    title: Shop above contracted kW
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      team: building
    annotations:
      summary: A shop is drawing more than its contracted power.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: energy-db
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: energy-db
        editorMode: code
        format: table
        rawQuery: true
        rawSql: 'SELECT name AS shop, p_kw / nullif(contracted_kw, 0) AS load_ratio

          FROM latest_readings WHERE role = ''shop'' AND contracted_kw > 0'
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1.0
  - uid: night-use
    title: Unusual night use
    condition: C
    for: 30m
    noDataState: OK
    execErrState: Error
    labels:
      team: building
    annotations:
      summary: A shop is using over 25% of its contracted power at night.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: energy-db
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: energy-db
        editorMode: code
        format: table
        rawQuery: true
        rawSql: "SELECT name AS shop, p_kw / nullif(contracted_kw, 0) AS night_ratio\nFROM latest_readings\nWHERE role = 'shop' AND contracted_kw > 0\n  AND (extract(hour FROM now() AT TIME ZONE 'Africa/Kigali')\
          \ >= 23 OR extract(hour FROM now() AT TIME ZONE 'Africa/Kigali') < 5)"
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.25
  - uid: fuel-low
    title: Generator fuel low
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      team: building
    annotations:
      summary: Generator fuel below 20%.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: energy-db
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: energy-db
        editorMode: code
        format: table
        rawQuery: true
        rawSql: 'SELECT (m->>''fuel_pct'')::float AS fuel_pct FROM readings r JOIN devices d USING (device_id)

          WHERE d.role = ''genset'' AND m ? ''fuel_pct'' ORDER BY ts DESC LIMIT 1'
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 20
  - uid: gateway-silent
    title: Gateway not reporting
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    labels:
      team: building
    annotations:
      summary: No data from the Pi gateway for 10 minutes (internet, power or Pi problem).
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: energy-db
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: energy-db
        editorMode: code
        format: table
        rawQuery: true
        rawSql: SELECT gateway, extract(epoch FROM now() - max(received)) / 60 AS minutes_silent FROM batches GROUP BY gateway
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
